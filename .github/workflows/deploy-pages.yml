name: Deploy landing and game (GitHub Pages + itch.io)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1) Landing + juego -> GitHub Pages
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 2) Solo el juego -> itch.io con Butler (CLI oficial de itch.io)
  # Requiere en GitHub (Settings > Secrets and variables > Actions):
  #   - Secret   BUTLER_API_KEY : API key de https://itch.io/user/settings/api-keys
  #   - Variable ITCH_GAME      : everocha11/los-guardianes-del-inti
  # Si la variable ITCH_GAME no existe, este job se omite y Pages sigue funcionando.
  itch:
    if: ${{ vars.ITCH_GAME != '' }}
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_GAME: ${{ vars.ITCH_GAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build game for itch.io
        run: npm run build:itch

      - name: Check API key
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::error::Falta el secret BUTLER_API_KEY"
            exit 1
          fi

      - name: Install Butler
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$HOME/butler"
          chmod +x "$HOME/butler/butler"
          "$HOME/butler/butler" -V

      - name: Push to itch.io
        run: |
          "$HOME/butler/butler" push dist-itch "$ITCH_GAME:html5" \
            --userversion "${GITHUB_SHA::7}"
